name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm test
        env:
          PORT: 8080
          TEST_DATABASE_URL: mongodb://localhost:27017/donePeriod-test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRY: 7d
          S3_BUCKET_NAME: test-bucket
          AWS_ACCESS_KEY_ID: fake
          AWS_SECRET_ACCESS_KEY: fake
